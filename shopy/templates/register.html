<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Shopy</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="header">
    <div class="container nav-container">
        <a href="/home" class="logo">Shopy</a>
        <nav class="nav-links">
            <a href="/home">Home</a>
            <a href="/cart">Cart</a>
            {% if session.get('user') %}
            <div class="profile-dropdown">
                <div class="profile-trigger">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <div class="dropdown-menu">
                    <div class="dropdown-user-info">
                        <span class="dropdown-user-name">{{ session.get('user') }}</span>
                        <span class="dropdown-user-role">Customer</span>
                    </div>
                    <a href="/logout" class="dropdown-item logout">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                        Logout
                    </a>
                </div>
            </div>
            {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
            {% endif %}
        </nav>
    </div>
</header>

<main class="container">
    <div class="auth-container" style="max-width: 500px;">
        <h2>Join Shopy</h2>
        <form method="POST">
            <div class="form-group">
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="text" name="full_name" class="form-control" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="tel" name="phone" class="form-control" placeholder="Phone Number" required>
            </div>
            <div class="form-group">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <textarea name="address" class="form-control" placeholder="Home Address" rows="3" required style="resize: none;"></textarea>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm" required>
                </div>
            </div>
            {% if error %}
            <p style="color: red; margin-bottom: 15px; font-size: 0.9rem;">{{ error }}</p>
            {% endif %}
            <button type="submit" class="btn">Register</button>
        </form>
    </div>
</main>

</body>
</html>
